<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="title desc"><title id="title">実価格から品質調整価格への変換</title><desc id="desc">スマートフォンAとBについて、実価格pから品質価値θqを差し引いて品質調整価格Z=p-θqへ移る変換を示す。実価格差は大きいが、品質調整後の差は小さくなる。</desc><style>:root{--paper:#f3efe6;--ink:#171714;--muted:#716d64;--accent:#5866e9;--green:#39705a}@media(prefers-color-scheme:dark){:root{--paper:#1c1c19;--ink:#f0eadf;--muted:#a8a196;--accent:#99a2ff;--green:#8bc4a9}}.lineA{stroke:var(--accent);stroke-width:4;fill:none;stroke-linecap:round}.lineB{stroke:var(--green);stroke-width:4;fill:none;stroke-linecap:round}.guide{stroke:var(--muted);stroke-width:2;stroke-dasharray:6 6}.dotA{fill:var(--accent)}.dotB{fill:var(--green)}.txt{fill:var(--ink);font:18px 'Noto Sans CJK JP','Hiragino Sans',sans-serif}.ann{fill:var(--ink);font:16px 'Noto Sans CJK JP','Hiragino Sans',sans-serif}.small{fill:var(--muted);font:13px 'Noto Sans CJK JP','Hiragino Sans',sans-serif}</style><text class="txt" x="210" y="44" text-anchor="middle">実価格 p</text><text class="txt" x="550" y="44" text-anchor="middle">品質調整価格 Z = p − θq</text><text class="txt" x="84" y="123" text-anchor="middle">A</text><circle class="dotA" cx="210" cy="118" r="7"/><text class="ann" x="210" y="95" text-anchor="middle">p_A = 74.68</text><path class="lineA" d="M 222 118 L 538 118"/><polygon points="538,118 526,112 526,124" fill="var(--accent)"/><text class="ann" x="380" y="104" text-anchor="middle">− θq_A = −90</text><circle class="dotA" cx="550" cy="118" r="7"/><text class="ann" x="550" y="95" text-anchor="middle">Z_A = −15.32</text><text class="txt" x="84" y="233" text-anchor="middle">B</text><circle class="dotB" cx="210" cy="228" r="7"/><text class="ann" x="210" y="205" text-anchor="middle">p_B = 56.71</text><path class="lineB" d="M 222 228 L 538 228"/><polygon points="538,228 526,222 526,234" fill="var(--green)"/><text class="ann" x="380" y="214" text-anchor="middle">− θq_B = −70</text><circle class="dotB" cx="550" cy="228" r="7"/><text class="ann" x="550" y="205" text-anchor="middle">Z_B = −13.29</text><line class="guide" x1="145" y1="270" x2="275" y2="270"/><text class="ann" x="210" y="295" text-anchor="middle">実価格差 ≈ 17.97</text><line class="guide" x1="485" y1="270" x2="615" y2="270"/><text class="ann" x="550" y="295" text-anchor="middle">品質調整後の差 ≈ 2.03</text><text class="small" x="380" y="328" text-anchor="middle">価格差の多くは品質差で縮むが、Z_A = Z_B にはならない</text></svg>