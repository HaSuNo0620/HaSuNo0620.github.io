="point" cx="666" cy="63" r="4"/><circle class="point" cx="678" cy="123" r="4"/><circle class="point" cx="686" cy="93" r="4"/><circle class="point" cx="694" cy="63" r="4"/><circle class="point" cx="706" cy="123" r="4"/><circle class="point" cx="714" cy="93" r="4"/><circle class="point" cx="722" cy="63" r="4"/><text class="formula" x="630" y="175" text-anchor="middle">σ(z)</text><path class="arrow" d="M630 187v28l-5-6m5 6l5-6"/><text class="formula" x="630" y="245" text-anchor="middle">ζ(z)</text><path class="arrow" d="M630 255v28l-5-6m5 6l5-6"/><text class="formula" x="630" y="313" text-anchor="middle">℘(z)</text>
