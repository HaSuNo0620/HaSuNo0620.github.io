<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-labelledby="title desc">
<title id="title">零点の配置と対数微分</title><desc id="desc">単一の零点、一次元格子、二次元格子を比較し、対数微分で極を持つ関数へ移る。</desc>
<style>text{font-family:system-ui,sans-serif;fill:#171714}.axis{stroke:#999;stroke-width:1;opacity:.55}.point{fill:#5866e9}.arrow{stroke:#39705a;stroke-width:1.6;fill:none}.sub{font-size:13px}.formula{font-family:Georgia,serif;font-size:25px}.head{font-size:16px;font-weight:600}@media(prefers-color-scheme:dark){text{fill:#eceae5}.point{fill:#a5adff}.arrow{stroke:#82c5a8}.axis{stroke:#aaa}}</style>
