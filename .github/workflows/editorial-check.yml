name: Editorial site check
on:
  pull_request:
    branches: [main]
  push:
    branches: [editorial-restructure]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy matplotlib sympy
      - run: npm install
      - run: npm run build
      - run: npm run verify:site
